name: conformance

on:
  push:
  pull_request:

jobs:
  source-coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --extra test
      - run: uv run --extra test pytest
      - run: uv run --extra test python vectors-source-coverage/check_vectors.py --verifier 'probity-verify'
      - run: uv run --extra test python vectors-operand-lineage/check_vectors.py --verifier 'probity-verify'
  readme:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the README stays one screen and every link in it resolves
        run: |
          python3 scripts/readme-lint.py README.md
          python3 scripts/readme-lint-test.py
