name: brokered-file-write

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  installed-native-reader:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12'
      - name: retain the exact public producer package source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/brokered-file-write/producer-source
          git -C .build/brokered-file-write/producer-source init
          git -C .build/brokered-file-write/producer-source remote add origin https://github.com/probityai/agent-evidence-observer.git
          git -C .build/brokered-file-write/producer-source fetch --depth=1 --filter=blob:none origin 753932b42b00ab8257396112c529f840396f0ce7
          git -C .build/brokered-file-write/producer-source checkout FETCH_HEAD -- pyproject.toml README.md LICENSE src
          git -C .build/brokered-file-write/producer-source rev-parse FETCH_HEAD > .build/brokered-file-write/producer-revision.txt
          git -C .build/brokered-file-write/producer-source ls-tree -r FETCH_HEAD > .build/brokered-file-write/producer-tree.txt
      - name: build and install separate producer and consumer environments
        shell: bash
        run: |
          set -euo pipefail
          uv build --wheel --out-dir .build/brokered-file-write/wheels
          uv venv --python 3.12 .build/brokered-file-write/producer
          uv venv --python 3.12 .build/brokered-file-write/consumer
          uv pip install --python .build/brokered-file-write/producer/bin/python .build/brokered-file-write/producer-source
          uv pip install --python .build/brokered-file-write/consumer/bin/python .build/brokered-file-write/wheels/*.whl
          uv pip freeze --python .build/brokered-file-write/producer/bin/python > .build/brokered-file-write/producer-dependencies.txt
          uv pip freeze --python .build/brokered-file-write/consumer/bin/python > .build/brokered-file-write/consumer-dependencies.txt
          .build/brokered-file-write/consumer/bin/python -I -c 'import importlib.util; assert importlib.util.find_spec("probity_observer") is None'
      - name: retain real hard exits and installed reader decisions
        run: >-
          .build/brokered-file-write/consumer/bin/python -I
          scripts/check-brokered-file-write.py
          --producer-python "${{ github.workspace }}/.build/brokered-file-write/producer/bin/python"
          --verifier "${{ github.workspace }}/.build/brokered-file-write/consumer/bin/probity-verify"
          --output "${{ github.workspace }}/.build/brokered-file-write/native"
      - name: bind the bounded public capture
        if: always()
        run: python3 scripts/manifest-brokered-file-write.py .build/brokered-file-write
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: brokered-file-write-installed-native
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          path: |
            .build/brokered-file-write/manifest.json
            .build/brokered-file-write/native
            .build/brokered-file-write/wheels
            .build/brokered-file-write/producer-source/pyproject.toml
            .build/brokered-file-write/producer-source/README.md
            .build/brokered-file-write/producer-source/LICENSE
            .build/brokered-file-write/producer-source/src
            .build/brokered-file-write/producer-revision.txt
            .build/brokered-file-write/producer-tree.txt
            .build/brokered-file-write/producer-dependencies.txt
            .build/brokered-file-write/consumer-dependencies.txt
